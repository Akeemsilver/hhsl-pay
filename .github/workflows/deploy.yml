name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The PDF guide is rebuilt from guide/build_guide.py on every deploy, so the live guide always matches this
      # version of the app and carries the app's real web address and the deploy date.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab pillow
      - name: Build the mobile guide (PDF)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: python guide/build_guide.py --out public/HHSL-pay-app-mobile-guide.pdf --link "https://${OWNER,,}.github.io/${REPO}/" --stamp "$(date -u +%F), build ${GITHUB_SHA::7}"
      - run: npm run build
        env:
          # The web address follows the repository name, so renaming the repository renames the link.
          # Set the repository variable BASE_PATH to "/" if you move to a custom domain.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
